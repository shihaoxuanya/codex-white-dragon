   geometric seal assembles, then the portrait breaks through the light. */
.stage:before{animation:none;transform-origin:68% 48%;will-change:transform}

   Both illustrations occupy the same frame; a soft light veil links them. */

  <div class="copy"><div class="eyebrow">白龙序章</div><h1>CO<span>DEX</span></h1><p class="subtitle">灵感，正在苏醒</p><div class="divider"></div></div>
  <div class="frame"></div>
  <div class="status" aria-live="polite"><i aria-hidden="true"></i><span id="status">启动序列 · 正在扫描</span></div>
  <div class="controls"><button id="sound" type="button">开启声音</button><button class="replay" id="replay" type="button">重新播放</button><button class="skip" id="skip" type="button">跳过 <span aria-hidden="true">· Esc</span></button></div>
</main>
<script>
(()=>{
  const stage=document.getElementById('stage'),canvas=document.getElementById('stars'),ctx=canvas.getContext('2d'),status=document.getElementById('status');
  const params=new URLSearchParams(location.search),launcher=params.get('launcher')==='1',preview=launcher&&params.get('preview')==='1',waitForWindow=launcher&&!preview&&params.get('wait')==='1';
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(launcher) stage.classList.add('launcher');
  let timers=[],frame,start,particles=[],w=0,h=0;
  let soundContext,soundNodes=[],soundMaster,soundEnabled=true,soundPlaying=false,sequenceStart=0,roomImpulse;
  const soundButton=document.getElementById('sound');
  function updateSoundButton(){if(soundButton.disabled)return;const audible=soundEnabled&&soundContext&&soundContext.state==='running';soundButton.textContent=audible?'静音':'开启声音'}
  function stopSound(){
    const nodes=soundNodes,master=soundMaster;
    soundNodes=[];soundMaster=null;soundPlaying=false;
    if(!soundContext)return;
    const now=soundContext.currentTime,fade=.12;
    if(master){
      try{if(master.gain.cancelAndHoldAtTime)master.gain.cancelAndHoldAtTime(now);else{master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now)}master.gain.linearRampToValueAtTime(0,now+fade)}catch{}
      setTimeout(()=>{try{master.disconnect()}catch{}},(fade+.1)*1000);
    }
    for(const node of nodes){try{node.stop(now+fade)}catch{}}
  }
  function prepareRoom(){
    if(roomImpulse||!soundContext)return;
    const length=Math.floor(soundContext.sampleRate*1.8),impulse=soundContext.createBuffer(2,length,soundContext.sampleRate);
    let seed=7219;
    for(let channel=0;channel<2;channel++){
      const data=impulse.getChannelData(channel);
      for(let i=0;i<length;i++){seed=(seed*16807)%2147483647;const decay=1-i/length;data[i]=(seed/1073741823.5-1)*decay*decay*decay*.22}
    }
    roomImpulse=impulse;
  }
  function soundSequence(){
    if(!soundContext||soundContext.state!=='running'||!soundEnabled||soundPlaying||stage.classList.contains('finished'))return;
    soundPlaying=true;
    const elapsed=(performance.now()-sequenceStart)/1000,now=soundContext.currentTime;
    const master=soundContext.createGain();master.gain.setValueAtTime(.85,now);master.connect(soundContext.destination);soundMaster=master;
    // A small stereo room makes the sustained voices and bells feel distant,
    // while keeping every source behind the same fade-out for mute and skip.
    const room=soundContext.createConvolver(),wet=soundContext.createGain();
    prepareRoom();room.buffer=roomImpulse;wet.gain.value=.22;room.connect(wet);wet.connect(master);
    // Four slow, overlapping chords underpin the reveal; bells rise with the
    // light and meet the transformation's peak at about 4.3 seconds.
    const pads=[
      [0,146.83,4.1,.013],[.12,220,4,.010],[.25,293.66,3.9,.009],[.45,369.99,3.7,.007],
      [3.15,196,3.65,.011],[3.25,293.66,3.55,.009],[3.35,369.99,3.45,.008],[3.5,440,3.25,.006],
      [6.1,123.47,3.4,.010],[6.2,185,3.3,.008],[6.3,293.66,3.2,.008],[6.4,440,3.1,.005],
      [8.55,146.83,3.35,.010],[8.65,220,3.25,.008],[8.75,369.99,3.15,.007],[8.9,587.33,3,.004]
    ];
    const bells=[[.65,440,2.5,.010],[1.65,587.33,2.4,.009],[2.65,739.99,2.1,.008],[3.55,440,2.5,.010],[4.05,587.33,2.7,.012],[4.35,739.99,2.9,.013],[5.5,659.26,2.6,.009],[6.85,587.33,2.5,.008],[8.15,440,2.5,.007],[9.4,587.33,2.4,.006]];
    function voice(at,hz,duration,volume,kind,index){
      const position=Math.max(0,elapsed-at);
      if(position>=duration)return;
      const begin=now+Math.max(0,at-elapsed),remaining=duration-position;
      const attack=kind==='pad'?Math.min(.95,duration*.32):.055;
      const envelope=t=>{
        if(t<=0||t>=duration)return 0;
        if(t<attack)return volume*Math.sin(t/attack*Math.PI/2);
        if(kind==='bell')return volume*Math.exp(-2.8*(t-attack)/(duration-attack))*Math.min(1,(duration-t)/.22);
        const release=Math.min(1.45,duration*.42);
        return volume*(t>duration-release?Math.sin((duration-t)/release*Math.PI/2):1);
      };
      const parts=kind==='pad'?[['sine',1,.68,-4],['sine',1,.32,4],['triangle',2,.08,0]]:[['sine',1,1,0],['sine',2,.18,2],['sine',3.01,.045,-3]];
      for(const [type,ratio,level,detune] of parts){
        const oscillator=soundContext.createOscillator(),gain=soundContext.createGain();
        oscillator.type=type;oscillator.frequency.setValueAtTime(hz*ratio,begin);oscillator.detune.setValueAtTime(detune+(index%2?1:-1),begin);
        gain.gain.setValueAtTime(0,begin);
        const fadeIn=Math.min(.04,remaining*.2);
        gain.gain.linearRampToValueAtTime(envelope(position+fadeIn)*level,begin+fadeIn);
        for(let t=position+fadeIn+.1;t<duration;t+=.1)gain.gain.linearRampToValueAtTime(envelope(t)*level,begin+t-position);
        gain.gain.linearRampToValueAtTime(0,begin+remaining);
        oscillator.connect(gain);gain.connect(master);gain.connect(room);
        oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()};
        oscillator.start(begin);oscillator.stop(begin+remaining+.02);soundNodes.push(oscillator);
      }
    }
    pads.forEach((note,index)=>voice(...note,'pad',index));
    bells.forEach((note,index)=>voice(...note,'bell',index));
  }
  function trySound(){
    if(!soundEnabled)return;
    try{const AudioType=window.AudioContext||window.webkitAudioContext;if(!AudioType){soundButton.textContent='声音不可用';soundButton.disabled=true;return}if(!soundContext)soundContext=new AudioType();updateSoundButton();if(soundContext.state==='running')soundSequence();else soundContext.resume().then(()=>{updateSoundButton();soundSequence()}).catch(updateSoundButton)}catch{soundButton.textContent='声音不可用';soundButton.disabled=true}
  }
  function resize(){const d=Math.min(window.devicePixelRatio||1,1);w=innerWidth;h=innerHeight;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);particles=Array.from({length:Math.min(100,Math.round(w*h/9000))},()=>({x:Math.random()*w,y:Math.random()*h,r:.5+Math.random()*1.9,s:.4+Math.random()*.9,a:.25+Math.random()*.65,p:Math.random()*6.28,angle:Math.random()*6.28,distance:80+Math.random()*Math.max(w,h)*.55}));}
  function draw(t){ctx.clearRect(0,0,w,h);const elapsed=(t-sequenceStart)/1000,cx=w*.68,cy=h*.49;for(const p of particles){const a=p.a*(.65+.35*Math.sin(elapsed*2.6+p.p));let x,y;if(elapsed<3.5){const travel=Math.max(0,1-elapsed/3.5);x=cx+Math.cos(p.angle)*p.distance*travel;y=cy+Math.sin(p.angle)*p.distance*travel}else{const dt=elapsed-3.5,u=Math.min(1,dt/2),spread=u*u*(3-2*u);x=((cx+(p.x-cx)*spread+dt*p.s*18*spread)%w+w)%w;y=((cy+(p.y-cy)*spread-dt*p.s*26*spread)%h+h)%h}const rx=w*(w<=700?.39:.27),ry=h*.65,centerX=w*(w<=700?.72:.68);if(((x-centerX)/rx)**2+((y-h*.5)/ry)**2<.64)continue;ctx.fillStyle=`rgba(255,248,220,${a})`;ctx.strokeStyle=`rgba(238,200,124,${a*.75})`;ctx.lineWidth=p.r*.7;if(elapsed<3.5){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(p.angle)*p.s*24,y+Math.sin(p.angle)*p.s*24);ctx.stroke()}ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fill()}frame=requestAnimationFrame(draw)}
  function clearTimers(){timers.forEach(clearTimeout);timers=[]}
  function finish(manual=false){clearTimers();stopSound();const waiting=launcher&&!preview&&!manual&&!reduce;if(!waiting)cancelAnimationFrame(frame);stage.classList.toggle('waiting',waiting);stage.classList.add('finished');if(launcher&&preview){status.textContent='预览结束';setTimeout(()=>window.close(),120);return}status.textContent=launcher?'正在打开 Codex':'动画播放完毕';if(launcher)document.title='CodexAnimationFinished'}
  function play(){clearTimers();stopSound();cancelAnimationFrame(frame);stage.classList.remove('finished','playing','waiting');document.getElementById('skip').firstChild.textContent='跳过 ';void stage.offsetWidth;stage.classList.add('playing');sequenceStart=performance.now();status.textContent='启动序列 · 圣光初现';for(const el of stage.querySelectorAll('.grid')){el.style.animation='none';void el.offsetWidth;el.style.animation=''}if(!reduce){frame=requestAnimationFrame(draw);timers.push(setTimeout(()=>status.textContent='启动序列 · 圣光变身',3200));timers.push(setTimeout(()=>status.textContent='启动序列 · 白龙觉醒',6500));timers.push(setTimeout(()=>status.textContent='启动序列 · 即将开启',9500));trySound()}timers.push(setTimeout(()=>finish(),reduce?900:12000))}
  soundButton.addEventListener('click',()=>{if(soundEnabled&&soundContext&&soundContext.state==='running'){soundEnabled=false;stopSound();updateSoundButton()}else{soundEnabled=true;trySound();updateSoundButton()}});
  document.getElementById('skip').addEventListener('click',()=>finish(true));document.getElementById('replay').addEventListener('click',play);window.addEventListener('keydown',e=>{if(e.key==='Escape')finish(true)});window.addEventListener('resize',resize);window.addEventListener('pagehide',()=>{cancelAnimationFrame(frame);stopSound()});resize();
  if(waitForWindow){
    // Decode the large image assets before the launcher exposes the scene.
    // The browser can move across monitors with different DPI while it is
    // being prepared, so wait for its viewport to settle before playback.
    let hiddenOnce=false,prepared=false,armed=false,started=false,assetsReady=false,lastGeometry='',stableSince=performance.now();
    const artwork=['celestial-background.png','character-before.png','character-dragon.png'].map(src=>{const img=new Image();img.src=src;return img});
    const decoding=Promise.all(artwork.map(img=>img.decode().catch(()=>{})));
    Promise.race([Promise.all([decoding,document.fonts.ready]),new Promise(resolve=>setTimeout(resolve,10000))]).then(()=>{
      if(!reduce&&soundEnabled){try{const AudioType=window.AudioContext||window.webkitAudioContext;if(AudioType){if(!soundContext)soundContext=new AudioType();prepareRoom()}}catch{}}
      assetsReady=true;onVisibility();
    });
    const onVisibility=()=>{
      if(document.hidden){hiddenOnce=true;if(assetsReady){if(prepared){armed=true;document.title='CodexAnimationArmed'}else document.title='CodexAnimationReady'}}
      else if(armed&&!started){started=true;clearInterval(positionWatch);document.removeEventListener('visibilitychange',onVisibility);resize();play();document.title='CodexAnimationPlaying'}
      else if(hiddenOnce&&!prepared&&assetsReady){
        const left=screen.availLeft??0,top=screen.availTop??0;
        const visibleWidth=Math.min(screenX+outerWidth,left+screen.availWidth)-Math.max(screenX,left);
        const visibleHeight=Math.min(screenY+outerHeight,top+screen.availHeight)-Math.max(screenY,top);
        if(visibleWidth<100||visibleHeight<100)return;
        const geometry=[screenX,screenY,outerWidth,outerHeight,innerWidth,innerHeight,devicePixelRatio].join(',');
        if(geometry!==lastGeometry){lastGeometry=geometry;stableSince=performance.now()}
        if(performance.now()-stableSince>=700){prepared=true;resize();requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!armed)document.title='CodexAnimationPrepared'}))}
      }
    };
    const positionWatch=setInterval(onVisibility,100);
    document.addEventListener('visibilitychange',onVisibility);
    onVisibility();
  }else play();
})();
</script>
